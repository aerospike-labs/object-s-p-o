# Gremlin Server over the vertex model in Aerospike. Start with ./run.sh;
# gdotv and other Gremlin clients connect to ws://localhost:8182/gremlin, traversal source g.
#
# The server runs Groovy scripts sent by any client that can reach it, with the JVM's
# privileges, and has no authentication: it listens on localhost only. Before binding to
# another interface, turn on authentication and TLS, for example:
#   authentication: {
#     authenticator: org.apache.tinkerpop.gremlin.server.auth.SimpleAuthenticator,
#     config: { credentialsDb: conf/tinkergraph-credentials.properties }}
#   ssl: { enabled: true, keyStore: conf/server.jks, keyStorePassword: changeit }
host: 127.0.0.1
port: 8182
evaluationTimeout: 120000
graphs: {
  graph: conf/aerolpg.properties
}
scriptEngines: {
  gremlin-groovy: {
    plugins: {
      org.apache.tinkerpop.gremlin.server.jsr223.GremlinServerGremlinPlugin: {},
      org.apache.tinkerpop.gremlin.jsr223.ImportGremlinPlugin: {classImports: [java.lang.Math], methodImports: [java.lang.Math#*]},
      org.apache.tinkerpop.gremlin.jsr223.ScriptFileGremlinPlugin: {files: [scripts/init.groovy]}
    }
  }
}
serializers:
  - { className: org.apache.tinkerpop.gremlin.util.ser.GraphBinaryMessageSerializerV1 }
  - { className: org.apache.tinkerpop.gremlin.util.ser.GraphBinaryMessageSerializerV1, config: { serializeResultToString: true }}
  - { className: org.apache.tinkerpop.gremlin.util.ser.GraphSONMessageSerializerV3 }
  - { className: org.apache.tinkerpop.gremlin.util.ser.GraphSONUntypedMessageSerializerV1 }
metrics: {
  slf4jReporter: {enabled: false}
}
strictTransactionManagement: false
maxInitialLineLength: 4096
maxHeaderSize: 8192
maxChunkSize: 8192
maxContentLength: 10485760
maxAccumulationBufferComponents: 1024
resultIterationBatchSize: 64
